name: Stream Session

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'اسم المستخدم صاحب الجلسة'
        required: true
        type: string
      email:
        description: 'البريد الإلكتروني لصاحب الجلسة (للعرض فقط)'
        required: false
        type: string

concurrency:
  group: streaming-group-v3-${{ github.event.inputs.username }}
  cancel-in-progress: false

env:
  ENABLE_STREAM: 1

jobs:
  stream:
    name: "👤 ${{ github.event.inputs.email || github.event.inputs.username }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 140
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 🧹 Delete Old Logs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      - name: Install System Dependencies (Fast Cache)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: xvfb ffmpeg pulseaudio unclutter xdotool curl dbus dbus-x11
          version: 1.0
          execute_install_scripts: true

      - name: Setup Chrome & Notifications
        run: |
          if ! command -v google-chrome-stable &> /dev/null; then
            echo "Chrome not found. Installing..."
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -y -f || true
            rm google-chrome-stable_current_amd64.deb
          else
            echo "Chrome is already installed. Skipping to save time."
          fi

          pulseaudio -D --exit-idle-time=-1 --disallow-exit || true
          pactl load-module module-null-sink sink_name=Sink1

          mkdir -p ~/.config
          export $(dbus-launch) || true
          
          systemctl --user mask org.freedesktop.Notifications.service 2>/dev/null || true
          sudo tee /usr/local/bin/notify-send > /dev/null <<'NS'
          #!/bin/sh
          exit 0
          NS
          sudo chmod +x /usr/local/bin/notify-send

      - name: Remove old Chromedriver & Python Setup
        run: |
          sudo rm -f /usr/bin/chromedriver
          sudo rm -f /usr/local/bin/chromedriver
          pip install -U urllib3 chardet requests selenium pyvirtualdisplay google-auth

      - name: Create Python Script
        run: |
          cat << 'EOF' > main.py
          import os, subprocess, time, requests, signal, urllib.parse, tempfile, json, ipaddress, socket, random, threading
          from pyvirtualdisplay import Display
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import google.auth.transport.requests
          from google.oauth2 import service_account

          FIREBASE_BASE = "https://control-gitlive-default-rtdb.europe-west1.firebasedatabase.app"
          AUTO_START_DELAY_SECONDS = 5 

          APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiOYTQBYRQ5d1Kv0bp7ODFyT1c8VTfGpAH_ZQt5YHOO_t6HPaVyCaVZRGQ0LrjcQxz/exec"

          SESSION_MIN_MINUTES = 70
          SESSION_MAX_MINUTES = 130
          SESSION_HARD_LIMIT_SECONDS = (SESSION_MAX_MINUTES + 5) * 60

          VIEWER_MIN_THRESHOLD = 10
          VIEWER_CHECK_INTERVAL_SECONDS = 60
          VIEWER_KILL_AFTER_SECONDS = 21 * 60
          HEARTBEAT_INTERVAL_SECONDS = 30

          AUTO_CLICK_INTERVAL_SECONDS = 30

          YOUTUBE_API_KEY = os.environ.get("YOUTUBE_API_KEY", "")

          ORIENTATIONS = {
              "portrait":  {"out_w": 720,  "out_h": 1280, "xvfb_w": 720,  "xvfb_h": 1360},
              "landscape": {"out_w": 1280, "out_h": 720,  "xvfb_w": 1280, "xvfb_h": 800},
          }
          DEFAULT_ORIENTATION = "portrait"

          GLOBAL_REFS = {
              "ffmpeg_proc": None,
              "driver": None,
              "disp": None,
              "username": None,
              "access_token": None,
          }

          def get_access_token():
              if GLOBAL_REFS.get("access_token"):
                  return GLOBAL_REFS["access_token"]
              try:
                  sa_info = json.loads(os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON', '{}'))
                  if not sa_info:
                      print("ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is empty or missing")
                      return None
                  credentials = service_account.Credentials.from_service_account_info(
                      sa_info,
                      scopes=['https://www.googleapis.com/auth/firebase.database',
                              'https://www.googleapis.com/auth/userinfo.email']
                  )
                  credentials.refresh(google.auth.transport.requests.Request())
                  GLOBAL_REFS["access_token"] = credentials.token
                  print("OK: Service account access token obtained")
                  return credentials.token
              except Exception as e:
                  print(f"ERROR getting access token: {e}")
                  return None

          def user_url(username):
              return FIREBASE_BASE + "/control/users/" + username + ".json"

          def get_firebase_data(username):
              if not username: return {}
              try:
                  token = get_access_token()
                  if not token:
                      print("ERROR: No access token available for Firebase GET")
                      return {}
                  url = user_url(username) + '?access_token=' + urllib.parse.quote(token)
                  res = requests.get(url, timeout=10)
                  if res.status_code != 200:
                      print(f"ERROR: Firebase GET failed HTTP {res.status_code}: {res.text[:300]}")
                      return {}
                  data = res.json() or {}
                  print(f"OK: Firebase GET success. Keys: {list(data.keys())}")
                  return data
              except Exception as e:
                  print(f"ERROR: Firebase GET exception: {e}")
                  return {}

          def patch_firebase(username, payload):
              try:
                  token = get_access_token()
                  if not token:
                      print("ERROR: No access token available for Firebase PATCH")
                      return
                  url = user_url(username) + '?access_token=' + urllib.parse.quote(token)
                  headers = {'Content-Type': 'application/json'}
                  r = requests.patch(url, json=payload, headers=headers, timeout=10)
                  if r.status_code != 200:
                      print(f"ERROR: Firebase PATCH failed HTTP {r.status_code}: {r.text[:300]}")
                  else:
                      print(f"OK: Firebase PATCH success: {payload}")
              except Exception as e:
                  print(f"ERROR: Firebase PATCH exception: {e}")

          def cleanup_processes():
              p = GLOBAL_REFS.get("ffmpeg_proc")
              if p:
                  try: p.terminate()
                  except: pass
              drv = GLOBAL_REFS.get("driver")
              if drv:
                  try: drv.quit()
                  except: pass
              dsp = GLOBAL_REFS.get("disp")
              if dsp:
                  try: dsp.stop()
                  except: pass

          def kill_all(signum, frame):
              cleanup_processes()
              u = GLOBAL_REFS.get("username")
              if u:
                  patch_firebase(u, {"session_active": False, "streaming": False, "viewers_count": 0, "likes_count": 0, "screen_share_active": False})
              os._exit(0)

          signal.signal(signal.SIGTERM, kill_all)
          signal.signal(signal.SIGINT, kill_all)

          def sleep_interruptible(seconds, username):
              for _ in range(int(seconds)):
                  time.sleep(1)
                  d = get_firebase_data(username)
                  if not d.get("session_active", False):
                      return False
              return True

          def is_safe_url(url):
              try:
                  u = urllib.parse.urlparse(url)
                  if u.scheme not in ('http', 'https'):
                      return False
                  if not u.hostname:
                      return False
                  ip = socket.gethostbyname(u.hostname)
                  ip_obj = ipaddress.ip_address(ip)
                  if (ip_obj.is_private or ip_obj.is_loopback or 
                      ip_obj.is_link_local or ip_obj.is_reserved or 
                      ip_obj.is_multicast or ip_obj.is_unspecified):
                      return False
                  return True
              except:
                  return False

          def fetch_live_stats(broadcast_id):
              if not broadcast_id or not YOUTUBE_API_KEY:
                  return None
              try:
                  url = (
                      "https://www.googleapis.com/youtube/v3/videos"
                      "?part=liveStreamingDetails,statistics"
                      "&id=" + urllib.parse.quote(broadcast_id) +
                      "&key=" + urllib.parse.quote(YOUTUBE_API_KEY)
                  )
                  res = requests.get(url, timeout=10)
                  if res.status_code != 200:
                      print(f"WARN: fetch_live_stats HTTP {res.status_code}: {res.text[:200]}")
                      return None
                  data = res.json()
                  items = data.get("items", [])
                  if not items:
                      return None
                  item = items[0]
                  details = item.get("liveStreamingDetails", {}) or {}
                  stats = item.get("statistics", {}) or {}
                  v = details.get("concurrentViewers")
                  lk = stats.get("likeCount")
                  return {
                      "viewers": int(v) if v is not None else 0,
                      "likes": int(lk) if lk is not None else 0
                  }
              except Exception as e:
                  print(f"WARN: fetch_live_stats failed: {e}")
                  return None

          def _ffmpeg_log_reader(proc):
              try:
                  for line in proc.stdout:
                      print(f"[ffmpeg] {line.rstrip()}", flush=True)
              except Exception:
                  pass

          def build_chrome_prefs_dir():
              profile_dir = tempfile.mkdtemp(prefix="chrome-profile-")
              default_dir = os.path.join(profile_dir, "Default")
              os.makedirs(default_dir, exist_ok=True)
              prefs = {
                  "profile": {
                      "default_content_setting_values": {
                          "notifications": 2, "geolocation": 2,
                          "media_stream": 1, "media_stream_mic": 1, "media_stream_camera": 1, "sound": 1,
                      },
                      "default_content_settings": {"notifications": 2, "popups": 1, "geolocation": 2},
                      "block_popups": False, "exit_type": "Normal", "exited_cleanly": True,
                  },
                  "bookmark_bar": { "show_on_all_tabs": False },
                  "translate": { "enabled": False },
                  "credentials_enable_service": False,
                  "profile.password_manager_enabled": False,
                  "browser": { "has_seen_welcome_page": True, "check_default_browser": False },
                  "distribution": {
                      "skip_first_run_ui": True, "suppress_first_run_bubble": True,
                      "import_bookmarks": False, "import_history": False,
                      "show_welcome_page": False, "skip_first_run_tasks": True,
                  },
              }
              with open(os.path.join(default_dir, "Preferences"), "w", encoding="utf-8") as f:
                  json.dump(prefs, f)
              return profile_dir

          def build_chrome_options(xvfb_w=720, xvfb_h=1360):
              opts = Options()
              opts.add_argument('--no-sandbox')
              opts.add_argument('--disable-dev-shm-usage')
              opts.add_argument('--autoplay-policy=no-user-gesture-required')
              opts.add_argument(f'--window-size={xvfb_w},{xvfb_h}')
              opts.add_argument('--start-maximized')
              opts.add_argument('--disable-infobars')
              opts.add_argument('--disable-notifications')
              opts.add_argument('--disable-push-api')
              opts.add_argument('--disable-desktop-notifications')

              opts.add_argument('--disable-features=TranslateUI,Translate,NotificationTriggers,NotificationIndicator,WebPush,BackgroundFetch,PeriodicBackgroundSync,GlobalMediaControls,MediaRouter')
              opts.add_argument('--no-default-browser-check')
              opts.add_argument('--no-first-run')
              opts.add_argument('--disable-sync')

              prefs = {
                  "credentials_enable_service": False,
                  "profile.password_manager_enabled": False,
                  "profile.default_content_setting_values.notifications": 2,
                  "bookmark_bar": { "show_on_all_tabs": False }
              }
              opts.add_experimental_option("prefs", prefs)
              opts.add_experimental_option("excludeSwitches", ["enable-automation", "enable-logging"])
              opts.add_experimental_option("useAutomationExtension", False)

              opts.add_argument(f"--user-data-dir={build_chrome_prefs_dir()}")
              return opts

          def click_center_of_screen(xvfb_w, xvfb_h):
              try:
                  cx = xvfb_w // 2
                  cy = xvfb_h // 2
                  os.system(f"xdotool mousemove --sync {cx} {cy} click --clearmodifiers 1")
                  print(f"🖱️ Auto-click at center ({cx},{cy})")
              except Exception as e:
                  print(f"WARN: click_center_of_screen failed: {e}")

          def recreate_browser_and_load(game_url, xvfb_w=720, xvfb_h=1360):
              print(f"🔄 Recreating browser for new URL: {game_url}")

              old_driver = GLOBAL_REFS.get("driver")
              if old_driver:
                  try:
                      old_driver.quit()
                  except Exception as e:
                      print(f"WARN: old driver quit failed: {e}")
              GLOBAL_REFS["driver"] = None

              new_opts = build_chrome_options(xvfb_w, xvfb_h)
              new_driver = webdriver.Chrome(options=new_opts)
              new_driver.set_window_size(xvfb_w, xvfb_h)
              print("OK: New Chrome started")

              try:
                  new_driver.execute_cdp_cmd("Browser.setPermission", {"permission": {"name": "notifications"}, "setting": "denied", "origin": "*"})
                  new_driver.execute_cdp_cmd("Page.enable", {})
              except Exception:
                  pass

              GLOBAL_REFS["driver"] = new_driver

              new_driver.get(game_url)
              print(f"OK: New browser loaded {game_url}")

              time.sleep(2)
              click_center_of_screen(xvfb_w, xvfb_h)

              return new_driver

          def get_orientation(data):
              o = (data.get("stream_orientation") or DEFAULT_ORIENTATION).lower()
              if o not in ORIENTATIONS:
                  o = DEFAULT_ORIENTATION
              return o

          def start_ffmpeg(disp_display, sink_name, stream_key, out_w, out_h, xvfb_w, xvfb_h):
              ffmpeg_cmd = [
                  'ffmpeg', '-y', '-loglevel', 'info',
                  '-stats', '-stats_period', '10',
                  '-thread_queue_size', '2048',
                  '-use_wallclock_as_timestamps', '1',
                  '-f', 'x11grab', '-draw_mouse', '0', '-framerate', '60',
                  '-video_size', f'{xvfb_w}x{xvfb_h}', '-i', f":{disp_display}",
                  '-thread_queue_size', '2048',
                  '-use_wallclock_as_timestamps', '1',
                  '-f', 'pulse', '-i', f"{sink_name}.monitor",
                  '-map', '0:v', '-map', '1:a',
                  '-vf', f'scale={out_w}:{out_h},fps=60',
                  '-af', 'aresample=async=1000',
                  '-vsync', '1',
                  '-c:v', 'libx264', '-preset', 'ultrafast', '-tune', 'zerolatency',
                  '-x264-params', 'threads=2:sliced-threads=1',
                  '-max_muxing_queue_size', '2048',
                  '-b:v', '3000k', '-maxrate', '3000k', '-bufsize', '6000k',
                  '-r', '60', '-g', '120', '-keyint_min', '120', '-sc_threshold', '0',
                  '-pix_fmt', 'yuv420p',
                  '-c:a', 'aac', '-b:a', '128k',
                  '-f', 'flv',
                  f"rtmp://a.rtmp.youtube.com/live2/{stream_key}"
              ]
              proc = subprocess.Popen(
                  ffmpeg_cmd,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  bufsize=1,
                  universal_newlines=True
              )
              GLOBAL_REFS["ffmpeg_proc"] = proc
              print(f"OK: FFmpeg PID = {proc.pid} (no crop, out={out_w}x{out_h})")
              threading.Thread(target=_ffmpeg_log_reader, args=(proc,), daemon=True).start()
              return proc

          def restart_capture_for_orientation(username, orientation, sink_name):
              print(f"🎛️ Switching orientation to: {orientation}")
              dims = ORIENTATIONS[orientation]

              old_ff = GLOBAL_REFS.get("ffmpeg_proc")
              if old_ff:
                  try: old_ff.terminate()
                  except: pass
              GLOBAL_REFS["ffmpeg_proc"] = None

              old_disp = GLOBAL_REFS.get("disp")
              if old_disp:
                  try: old_disp.stop()
                  except: pass
              GLOBAL_REFS["disp"] = None

              new_disp = Display(visible=0, size=(dims["xvfb_w"], dims["xvfb_h"]), backend='xvfb')
              new_disp.start()
              GLOBAL_REFS["disp"] = new_disp
              os.environ['DISPLAY'] = f":{new_disp.display}"
              print(f"OK: Xvfb restarted on :{new_disp.display} ({dims['xvfb_w']}x{dims['xvfb_h']})")

              data = get_firebase_data(username) or {}
              game_url = data.get("game_url", "")
              if game_url:
                  try:
                      recreate_browser_and_load(game_url, dims["xvfb_w"], dims["xvfb_h"])
                  except Exception as e:
                      print(f"WARN: browser reload after orientation change failed: {e}")

              stream_key = data.get("stream_key", "")
              if stream_key:
                  ffmpeg_proc = start_ffmpeg(
                      disp_display=new_disp.display,
                      sink_name=sink_name,
                      stream_key=stream_key,
                      out_w=dims["out_w"],
                      out_h=dims["out_h"],
                      xvfb_w=dims["xvfb_w"],
                      xvfb_h=dims["xvfb_h"],
                  )
                  return ffmpeg_proc, new_disp

              return None, new_disp

          def main():
              username = os.environ.get("INPUT_USERNAME")
              if not username:
                  print("ERROR: INPUT_USERNAME is empty")
                  return
              print(f"=== Starting session for user: {username} ===")
              GLOBAL_REFS["username"] = username

              patch_firebase(username, {"session_active": True, "screen_share_active": False})

              session_loop_start_ts = time.time()

              session_duration_minutes = random.randint(SESSION_MIN_MINUTES, SESSION_MAX_MINUTES)
              session_end_ts = session_loop_start_ts + session_duration_minutes * 60
              print(f"⏱️ Session duration chosen: {session_duration_minutes} minutes | end at: {int(session_end_ts)}")

              patch_firebase(username, {
                  "start_time": int(session_loop_start_ts * 1000),
                  "session_duration_minutes": session_duration_minutes,
                  "session_end_time": int(session_end_ts * 1000),
                  "viewers_updated_at": int(session_loop_start_ts * 1000),
                  "viewers_count": 0,
                  "likes_count": 0
              })

              sink_name = "Sink1"
              os.environ['PULSE_SINK'] = sink_name
              os.environ['DBUS_SESSION_BUS_ADDRESS'] = '/dev/null'
              os.environ['NOTIFY_SOCKET'] = '/dev/null'

              initial_data = get_firebase_data(username) or {}
              current_orientation = get_orientation(initial_data)
              dims = ORIENTATIONS[current_orientation]
              print(f"📐 Initial orientation: {current_orientation} ({dims['out_w']}x{dims['out_h']})")

              disp = Display(visible=0, size=(dims["xvfb_w"], dims["xvfb_h"]), backend='xvfb')
              disp.start()
              GLOBAL_REFS["disp"] = disp
              os.environ['DISPLAY'] = f":{disp.display}"
              print(f"OK: Xvfb started on display :{disp.display}")

              try:
                  xdpy = subprocess.check_output(
                      ['xdpyinfo', '-display', f":{disp.display}"],
                      stderr=subprocess.STDOUT, timeout=10
                  ).decode('utf-8', errors='ignore')
                  for line in xdpy.split('\n'):
                      if 'dimensions:' in line or 'depth of root' in line:
                          print(f"Xvfb: {line.strip()}")
              except Exception as e:
                  print(f"WARN: xdpyinfo check failed: {e}")

              subprocess.Popen(['unclutter', '-idle', '0', '-display', f":{disp.display}"])

              opts = build_chrome_options(dims["xvfb_w"], dims["xvfb_h"])

              driver = webdriver.Chrome(options=opts)
              driver.set_window_size(dims["xvfb_w"], dims["xvfb_h"])
              print("OK: Chrome started")

              try:
                  driver.execute_cdp_cmd("Browser.setPermission", {"permission": {"name": "notifications"}, "setting": "denied", "origin": "*"})
                  driver.execute_cdp_cmd("Page.enable", {})
              except Exception:
                  pass

              GLOBAL_REFS["driver"] = driver
              ffmpeg_proc = None
              last_url = ""
              auto_start_done = False

              low_viewer_streak_start = None
              last_viewer_check_ts = 0
              last_heartbeat_ts = 0
              last_auto_click_ts = 0

              try:
                  while True:
                      data = get_firebase_data(username)
                      if not data:
                          print("WARN: Firebase data empty, ending session")
                          break

                      streaming_active = data.get("streaming", False)
                      game_url = data.get("game_url", "")
                      stream_key = data.get("stream_key", "")
                      session_active = data.get("session_active", False)
                      start_time = data.get("start_time", 0)
                      broadcast_id = data.get("broadcast_id", "")
                      screen_share_active = data.get("screen_share_active", False)

                      desired_orientation = get_orientation(data)
                      if desired_orientation != current_orientation:
                          print(f"🎛️ Orientation change requested: {current_orientation} -> {desired_orientation}")
                          try:
                              ffmpeg_proc, disp = restart_capture_for_orientation(username, desired_orientation, sink_name)
                              current_orientation = desired_orientation
                              dims = ORIENTATIONS[current_orientation]
                              auto_start_done = True
                              last_url = ""
                          except Exception as e:
                              print(f"ERROR: orientation switch failed: {e}")
                          continue

                      hard_deadline_ts = session_loop_start_ts + SESSION_HARD_LIMIT_SECONDS

                      print(f"STATE: session_active={session_active} streaming={streaming_active} screen_share_active={screen_share_active} stream_key={'YES' if stream_key else 'NO'} game_url={'YES' if game_url else 'NO'} orientation={current_orientation} session_end_in_sec={int(session_end_ts - time.time())}")

                      if not session_active:
                          break

                      now_ts = time.time()
                      now_sec = int(now_ts)

                      if now_sec - last_auto_click_ts >= AUTO_CLICK_INTERVAL_SECONDS:
                          last_auto_click_ts = now_sec
                          click_center_of_screen(dims["xvfb_w"], dims["xvfb_h"])

                      if now_ts >= session_end_ts:
                          print(f"⏰ Session duration ({session_duration_minutes} min) reached. Stopping stream.")
                          patch_firebase(username, {"session_active": False, "streaming": False, "viewers_count": 0, "likes_count": 0})
                          break

                      if now_ts >= hard_deadline_ts:
                          print("⏰ Session hard limit reached. Stopping stream.")
                          patch_firebase(username, {"session_active": False, "streaming": False, "viewers_count": 0, "likes_count": 0})
                          break

                      if session_active and broadcast_id:
                          if now_sec - last_heartbeat_ts >= HEARTBEAT_INTERVAL_SECONDS:
                              last_heartbeat_ts = now_sec
                              try:
                                  patch_firebase(username, {"viewers_updated_at": int(now_ts * 1000)})
                              except Exception:
                                  pass

                      elapsed_since_start = now_sec - int(start_time / 1000) if start_time else 0

                      if (session_active and broadcast_id and start_time):
                          if now_sec - last_viewer_check_ts >= VIEWER_CHECK_INTERVAL_SECONDS:
                              last_viewer_check_ts = now_sec
                              stats = fetch_live_stats(broadcast_id)
                              if stats is not None:
                                  viewers = stats["viewers"]
                                  likes = stats["likes"]
                                  kill_enabled = elapsed_since_start >= VIEWER_KILL_AFTER_SECONDS
                                  print(f"[viewer-check] viewers={viewers} likes={likes} threshold={VIEWER_MIN_THRESHOLD} elapsed_min={elapsed_since_start//60} kill_enabled={kill_enabled}")

                                  try:
                                      patch_firebase(username, {
                                          "viewers_count": viewers,
                                          "likes_count": likes
                                      })
                                  except Exception as e:
                                      print(f"WARN: patch_firebase stats failed: {e}")

                                  if kill_enabled:
                                      if viewers < VIEWER_MIN_THRESHOLD:
                                          if low_viewer_streak_start is None:
                                              low_viewer_streak_start = now_sec
                                              print("[viewer-check] بدأ تتبع مشاهدين قليلين")
                                          else:
                                              streak = now_sec - low_viewer_streak_start
                                              if streak >= VIEWER_CHECK_INTERVAL_SECONDS:
                                                  print(f"⛔ [viewer-check] مشاهدين < {VIEWER_MIN_THRESHOLD} لمدة {streak}s — إنهاء الجلسة")
                                                  try:
                                                      patch_firebase(username, {
                                                          "session_active": False,
                                                          "streaming": False,
                                                          "viewers_count": 0,
                                                          "likes_count": 0
                                                      })
                                                  except Exception as e:
                                                      print(f"WARN: patch_firebase failed: {e}")
                                                  break
                                      else:
                                          if low_viewer_streak_start is not None:
                                              print("[viewer-check] عاد المشاهدون للطبيعي — تصفير العداد")
                                          low_viewer_streak_start = None
                              else:
                                  print("[viewer-check] فشل جلب الإحصائيات — تخطي هذه الدورة")

                      if (session_active and not streaming_active and not auto_start_done and start_time and stream_key):
                          elapsed = (time.time() * 1000) - start_time
                          if elapsed >= AUTO_START_DELAY_SECONDS * 1000:
                              patch_firebase(username, {"streaming": True})
                              streaming_active = True
                              auto_start_done = True

                      if game_url and game_url != last_url:
                          try:
                              if not is_safe_url(game_url):
                                  print(f"❌ ERROR: Unsafe URL blocked: {game_url}")
                                  continue

                              try:
                                  driver = recreate_browser_and_load(game_url, dims["xvfb_w"], dims["xvfb_h"])
                                  last_url = game_url
                              except Exception as re_err:
                                  print(f"WARN: recreate_browser_and_load failed: {re_err} — falling back to driver.get()")
                                  if GLOBAL_REFS.get("driver") is not None:
                                      driver = GLOBAL_REFS["driver"]
                                      try:
                                          driver.get(game_url)
                                          last_url = game_url
                                          print(f"OK (fallback): Loaded game_url via existing driver: {game_url}")
                                          if not sleep_interruptible(2, username): break
                                          click_center_of_screen(dims["xvfb_w"], dims["xvfb_h"])
                                      except Exception as get_err:
                                          print(f"WARN: fallback driver.get failed: {get_err}")
                                  else:
                                      try:
                                          driver = webdriver.Chrome(options=build_chrome_options(dims["xvfb_w"], dims["xvfb_h"]))
                                          driver.set_window_size(dims["xvfb_w"], dims["xvfb_h"])
                                          GLOBAL_REFS["driver"] = driver
                                          driver.get(game_url)
                                          last_url = game_url
                                          print(f"OK (recovery): Created recovery browser and loaded: {game_url}")
                                      except Exception as rec_err:
                                          print(f"CRITICAL: Cannot recover browser: {rec_err}")

                          except Exception as e:
                              print(f"WARN: Failed to load game_url: {e}")

                      if screen_share_active:
                          if ffmpeg_proc and ffmpeg_proc.poll() is None:
                              print("⏸️ screen_share_active=true، إيقاف بث اللعبة مؤقتاً")
                              try: ffmpeg_proc.terminate()
                              except: pass
                              ffmpeg_proc = None
                              GLOBAL_REFS["ffmpeg_proc"] = None
                      else:
                          if streaming_active and not ffmpeg_proc and stream_key:
                              print("▶️ screen_share_active=false، استئناف بث اللعبة")
                              ffmpeg_proc = start_ffmpeg(
                                  disp_display=disp.display,
                                  sink_name=sink_name,
                                  stream_key=stream_key,
                                  out_w=dims["out_w"],
                                  out_h=dims["out_h"],
                                  xvfb_w=dims["xvfb_w"],
                                  xvfb_h=dims["xvfb_h"],
                              )

                      if ffmpeg_proc and ffmpeg_proc.poll() is not None:
                          print(f"ERROR: FFmpeg exited with code {ffmpeg_proc.returncode}")
                          ffmpeg_proc = None
                          GLOBAL_REFS["ffmpeg_proc"] = None

                      if not sleep_interruptible(3, username): break

              except Exception as e:
                  print(f"ERROR: Main loop exception: {e}")
              finally:
                  if ffmpeg_proc:
                      try: ffmpeg_proc.kill()
                      except: pass
                  try: driver.quit()
                  except: pass
                  disp.stop()
                  patch_firebase(username, {"session_active": False, "streaming": False, "viewers_count": 0, "likes_count": 0, "screen_share_active": False})
                  print("=== Session ended ===")

          if __name__ == "__main__":
              main()
          EOF

      - name: Run Streaming Script
        env:
          ENABLE_STREAM: ${{ env.ENABLE_STREAM }}
          INPUT_USERNAME: ${{ github.event.inputs.username }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: Cleanup Firebase on Cancel/Timeout
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INPUT_USERNAME: ${{ github.event.inputs.username }}
        run: |
          python -c "
          import os, json, requests, urllib.parse, google.auth.transport.requests
          from google.oauth2 import service_account
          try:
              username = os.environ['INPUT_USERNAME']
              sa_info = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])
              creds = service_account.Credentials.from_service_account_info(sa_info, scopes=['https://www.googleapis.com/auth/firebase.database'])
              creds.refresh(google.auth.transport.requests.Request())
              url = 'https://control-gitlive-default-rtdb.europe-west1.firebasedatabase.app/control/users/' + urllib.parse.quote(username) + '.json?access_token=' + urllib.parse.quote(creds.token)
              r = requests.patch(url, json={'session_active': False, 'streaming': False, 'viewers_count': 0, 'likes_count': 0, 'screen_share_active': False}, headers={'Content-Type': 'application/json'}, timeout=10)
              print('Cleanup HTTP status:', r.status_code)
          except Exception as e:
              print('Cleanup failed:', e)
          "
