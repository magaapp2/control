name: Stream Session

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'اسم المستخدم صاحب الجلسة'
        required: true
        type: string
      email:
        description: 'البريد الإلكتروني لصاحب الجلسة (للعرض فقط)'
        required: false
        type: string

concurrency:
  group: streaming-group-${{ github.event.inputs.username }}
  cancel-in-progress: true

env:
  ENABLE_STREAM: 1

jobs:
  stream:
    name: "👤 ${{ github.event.inputs.email || github.event.inputs.username }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 🧹 Delete Old Logs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      - name: Install System Dependencies (Fast Cache)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: xvfb ffmpeg pulseaudio unclutter xdotool curl dbus dbus-x11
          version: 1.0
          execute_install_scripts: true

      - name: Setup Chrome & Notifications
        run: |
          if ! command -v google-chrome-stable &> /dev/null; then
            echo "Chrome not found. Installing..."
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -y -f || true
            rm google-chrome-stable_current_amd64.deb
          else
            echo "Chrome is already installed. Skipping to save time."
          fi

          pulseaudio -D --exit-idle-time=-1 --disallow-exit || true
          pactl load-module module-null-sink sink_name=Sink1

          mkdir -p ~/.config
          export $(dbus-launch) || true
          
          # تعطيل خدمة الإشعارات في النظام نهائياً
          systemctl --user mask org.freedesktop.Notifications.service 2>/dev/null || true
          sudo tee /usr/local/bin/notify-send > /dev/null <<'NS'
          #!/bin/sh
          exit 0
          NS
          sudo chmod +x /usr/local/bin/notify-send

      - name: Remove old Chromedriver & Python Setup
        run: |
          sudo rm -f /usr/bin/chromedriver
          sudo rm -f /usr/local/bin/chromedriver
          pip install -U urllib3 chardet requests selenium pyvirtualdisplay google-auth

      - name: Create Python Script
        run: |
          cat << 'EOF' > main.py
          import os, subprocess, time, requests, signal, urllib.parse, tempfile, json, ipaddress, socket, re
          from pyvirtualdisplay import Display
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import google.auth.transport.requests
          from google.oauth2 import service_account

          FIREBASE_BASE = "https://control-gitlive-default-rtdb.europe-west1.firebasedatabase.app"
          AUTO_START_DELAY_SECONDS = 5 

          # ⏱️ حدود الجلسة (بالدقائق) — يجب أن تتوافق مع Apps Script
          SESSION_MIN_MINUTES = 70
          SESSION_MAX_MINUTES = 130
          SESSION_HARD_LIMIT_SECONDS = (SESSION_MAX_MINUTES + 5) * 60  # هامش 5 دقائق للأمان

          # 🔎 إعدادات فحص عدد المشاهدين (بدون YouTube API)
          VIEWER_MIN_THRESHOLD = 100                    # الحد الأدنى للمشاهدين
          VIEWER_CHECK_INTERVAL_SECONDS = 10            # فحص كل 10 ثوانٍ (منذ البداية)
          VIEWER_KILL_AFTER_SECONDS = 10 * 60           # لا يُلغي الجلسة إلا بعد 10 دقائق من start_time

          GLOBAL_REFS = {
              "ffmpeg_proc": None,
              "fan_process": None,
              "driver": None,
              "disp": None,
              "username": None,
              "access_token": None
          }

          # دالة للحصول على التوكن الخاص بحساب الخدمة
          def get_access_token():
              if GLOBAL_REFS.get("access_token"):
                  return GLOBAL_REFS["access_token"]
              try:
                  sa_info = json.loads(os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON', '{}'))
                  if not sa_info:
                      print("ERROR: FIREBASE_SERVICE_ACCOUNT_JSON is empty or missing")
                      return None
                  credentials = service_account.Credentials.from_service_account_info(
                      sa_info,
                      scopes=['https://www.googleapis.com/auth/firebase.database',
                              'https://www.googleapis.com/auth/userinfo.email']
                  )
                  credentials.refresh(google.auth.transport.requests.Request())
                  GLOBAL_REFS["access_token"] = credentials.token
                  print("OK: Service account access token obtained")
                  return credentials.token
              except Exception as e:
                  print(f"ERROR getting access token: {e}")
                  return None

          def user_url(username):
              return FIREBASE_BASE + "/control/users/" + username + ".json"

          # ✅ القراءة باستخدام access_token في query parameter (الطريقة الصحيحة لحساب الخدمة)
          def get_firebase_data(username):
              if not username: return {}
              try:
                  token = get_access_token()
                  if not token:
                      print("ERROR: No access token available for Firebase GET")
                      return {}
                  url = user_url(username) + '?access_token=' + urllib.parse.quote(token)
                  res = requests.get(url, timeout=10)
                  if res.status_code != 200:
                      print(f"ERROR: Firebase GET failed HTTP {res.status_code}: {res.text[:300]}")
                      return {}
                  data = res.json() or {}
                  print(f"OK: Firebase GET success. Keys: {list(data.keys())}")
                  return data
              except Exception as e:
                  print(f"ERROR: Firebase GET exception: {e}")
                  return {}

          # ✅ الكتابة باستخدام access_token في query parameter
          def patch_firebase(username, payload):
              try:
                  token = get_access_token()
                  if not token:
                      print("ERROR: No access token available for Firebase PATCH")
                      return
                  url = user_url(username) + '?access_token=' + urllib.parse.quote(token)
                  headers = {'Content-Type': 'application/json'}
                  r = requests.patch(url, json=payload, headers=headers, timeout=10)
                  if r.status_code != 200:
                      print(f"ERROR: Firebase PATCH failed HTTP {r.status_code}: {r.text[:300]}")
                  else:
                      print(f"OK: Firebase PATCH success: {payload}")
              except Exception as e:
                  print(f"ERROR: Firebase PATCH exception: {e}")

          def cleanup_processes():
              for key in ["fan_process", "ffmpeg_proc"]:
                  p = GLOBAL_REFS.get(key)
                  if p:
                      try: p.terminate()
                      except: pass
              drv = GLOBAL_REFS.get("driver")
              if drv:
                  try: drv.quit()
                  except: pass
              dsp = GLOBAL_REFS.get("disp")
              if dsp:
                  try: dsp.stop()
                  except: pass

          def kill_all(signum, frame):
              cleanup_processes()
              u = GLOBAL_REFS.get("username")
              if u:
                  patch_firebase(u, {"session_active": False, "streaming": False, "viewers_count": 0})
              os._exit(0)

          signal.signal(signal.SIGTERM, kill_all)
          signal.signal(signal.SIGINT, kill_all)

          def sleep_interruptible(seconds, username):
              for _ in range(int(seconds)):
                  time.sleep(1)
                  d = get_firebase_data(username)
                  if not d.get("session_active", False):
                      return False
              return True

          # 🛡️ دالة حماية السيرفر من الاختراق (SSRF)
          # 🔒 SECURITY FIX: تحقق قوي من IP (يشمل IPv4/IPv6/private/loopback/reserved/link-local)
          def is_safe_url(url):
              try:
                  u = urllib.parse.urlparse(url)
                  if u.scheme not in ('http', 'https'):
                      return False
                  if not u.hostname:
                      return False
                  # حل الاسم إلى IP
                  ip = socket.gethostbyname(u.hostname)
                  ip_obj = ipaddress.ip_address(ip)
                  # رفض أي IP داخلي/محجوز/loopback/رابط محلي/multicast
                  if (ip_obj.is_private or ip_obj.is_loopback or 
                      ip_obj.is_link_local or ip_obj.is_reserved or 
                      ip_obj.is_multicast or ip_obj.is_unspecified):
                      return False
                  return True
              except:
                  return False

          def build_chrome_prefs_dir():
              profile_dir = tempfile.mkdtemp(prefix="chrome-profile-")
              default_dir = os.path.join(profile_dir, "Default")
              os.makedirs(default_dir, exist_ok=True)
              prefs = {
                  "profile": {
                      "default_content_setting_values": {
                          "notifications": 2, "geolocation": 2,
                          "media_stream": 1, "media_stream_mic": 1, "media_stream_camera": 1, "sound": 1,
                      },
                      "default_content_settings": {"notifications": 2, "popups": 1, "geolocation": 2},
                      "block_popups": False, "exit_type": "Normal", "exited_cleanly": True,
                  },
                  "bookmark_bar": { "show_on_all_tabs": False },
                  "translate": { "enabled": False },
                  "credentials_enable_service": False,
                  "profile.password_manager_enabled": False,
                  "browser": { "has_seen_welcome_page": True, "check_default_browser": False },
                  "distribution": {
                      "skip_first_run_ui": True, "suppress_first_run_bubble": True,
                      "import_bookmarks": False, "import_history": False,
                      "show_welcome_page": False, "skip_first_run_tasks": True,
                  },
              }
              with open(os.path.join(default_dir, "Preferences"), "w", encoding="utf-8") as f:
                  json.dump(prefs, f)
              return profile_dir

          # 🔎 قراءة عدد المشاهدين من HTML صفحة البث مباشرة (بدون YouTube API)
          def get_viewers_from_page(broadcast_id):
              if not broadcast_id:
                  return None
              try:
                  url = f"https://www.youtube.com/watch?v={broadcast_id}"
                  headers = {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                    "AppleWebKit/537.36 (KHTML, like Gecko) "
                                    "Chrome/122.0.0.0 Safari/537.36",
                      "Accept-Language": "en-US,en;q=0.9,ar;q=0.8",
                  }
                  res = requests.get(url, headers=headers, timeout=15)
                  html = res.text

                  # 1. البحث المباشر عن concurrentViewers بأي شكل داخل النصوص أو الـ JSON
                  # أحياناً يكون بصيغة رقمية أو نصية داخل الـ player response
                  match = re.search(r'"concurrentViewers"\s*:\s*"(\d+)"', html)
                  if match:
                      return int(match.group(1))

                  match = re.search(r'"concurrentViewers"\s*:\s*(\d+)', html)
                  if match:
                      return int(match.group(1))

                  # 2. البحث عن بيانات ytInitialPlayerResponse واستخراج الـ JSON الخاص بالبث المباشر
                  player_response_match = re.search(r'ytInitialPlayerResponse\s*=\s*({.+?});<\/script>', html)
                  if player_response_match:
                      try:
                          json_str = player_response_match.group(1)
                          data = json.loads(json_str)
                          
                          # الوصول إلى مسار المشاهدين المتزامنين في هيكل يوتيوب الداخلي
                          video_details = data.get("videoDetails", {})
                          if video_details.get("isLiveContent"):
                              # أحياناً يتم تضمين المتزامن في liveStreamingDetails داخل playerResponse
                              live_details = data.get("microformat", {}).get("playerMicroformatRenderer", {})
                              # أو عبر فحص الـ viewCount إذا كان البث جارياً
                              cc_viewers = data.get("streamingData", {}).get("concurrentViewers")
                              if cc_viewers:
                                  return int(cc_viewers)
                      except Exception:
                          pass

                  # 3. البحث عن النصوص الشائعة التي تعرض عدد المشاهدين في الصفحة (مثل watching now)
                  text_patterns = [
                      r'([\d,\.]+)\s*(?:people are watching|watching now|مشاهد الآن)',
                  ]
                  for pattern in text_patterns:
                      match = re.search(pattern, html, re.IGNORECASE)
                      if match:
                          num_str = match.group(1).replace(',', '').replace('.', '').replace('\u066c', '')
                          return int(num_str)

                  return None
              except Exception as e:
                  print(f"WARN: get_viewers_from_page exception: {e}")
                  return None

          def main():
              username = os.environ.get("INPUT_USERNAME")
              if not username:
                  print("ERROR: INPUT_USERNAME is empty")
                  return
              print(f"=== Starting session for user: {username} ===")
              GLOBAL_REFS["username"] = username
              
              patch_firebase(username, {"session_active": True})

              # ⏱️ بداية الجلسة داخل السيرفر (لحساب الحد الأقصى الاحتياطي)
              session_loop_start_ts = time.time()

              sink_name = "Sink1"
              os.environ['PULSE_SINK'] = sink_name
              os.environ['DBUS_SESSION_BUS_ADDRESS'] = '/dev/null'
              os.environ['NOTIFY_SOCKET'] = '/dev/null'

              disp = Display(visible=0, size=(720, 1360), backend='xvfb')
              disp.start()
              GLOBAL_REFS["disp"] = disp
              os.environ['DISPLAY'] = f":{disp.display}"
              print(f"OK: Xvfb started on display :{disp.display}")

              # ✅ التحقق من دقة وعمق Xvfb
              try:
                  xdpy = subprocess.check_output(
                      ['xdpyinfo', '-display', f":{disp.display}"],
                      stderr=subprocess.STDOUT, timeout=10
                  ).decode('utf-8', errors='ignore')
                  for line in xdpy.split('\n'):
                      if 'dimensions:' in line or 'depth of root' in line:
                          print(f"Xvfb: {line.strip()}")
              except Exception as e:
                  print(f"WARN: xdpyinfo check failed: {e}")

              subprocess.Popen(['unclutter', '-idle', '0', '-display', f":{disp.display}"])

              opts = Options()
              opts.add_argument('--no-sandbox')
              opts.add_argument('--disable-dev-shm-usage')
              opts.add_argument('--autoplay-policy=no-user-gesture-required')
              opts.add_argument('--window-size=720,1360')
              opts.add_argument('--start-maximized')
              opts.add_argument('--disable-infobars')
              opts.add_argument('--disable-notifications')
              opts.add_argument('--disable-push-api')
              opts.add_argument('--disable-desktop-notifications')
              
              # حظر شامل لكل ميزات الإشعارات والنوافذ العائمة
              opts.add_argument('--disable-features=TranslateUI,Translate,NotificationTriggers,NotificationIndicator,WebPush,BackgroundFetch,PeriodicBackgroundSync,GlobalMediaControls,MediaRouter')
              opts.add_argument('--no-default-browser-check')
              opts.add_argument('--no-first-run')
              opts.add_argument('--disable-sync')

              prefs = {
                  "credentials_enable_service": False,
                  "profile.password_manager_enabled": False,
                  "profile.default_content_setting_values.notifications": 2,
                  "bookmark_bar": { "show_on_all_tabs": False }
              }
              opts.add_experimental_option("prefs", prefs)
              opts.add_experimental_option("excludeSwitches", ["enable-automation", "enable-logging"])
              opts.add_experimental_option("useAutomationExtension", False)

              opts.add_argument(f"--user-data-dir={build_chrome_prefs_dir()}")

              driver = webdriver.Chrome(options=opts)
              driver.set_window_size(720, 1360)
              print("OK: Chrome started")

              try:
                  driver.execute_cdp_cmd("Browser.setPermission", {"permission": {"name": "notifications"}, "setting": "denied", "origin": "*"})
                  driver.execute_cdp_cmd("Page.enable", {})
              except Exception:
                  pass

              GLOBAL_REFS["driver"] = driver
              ffmpeg_proc = None
              fan_process = None
              last_url = ""
              auto_start_done = False

              # 🔎 حالة فحص عدد المشاهدين
              last_viewer_check_ts = 0
              viewer_check_count = 0

              try:
                  while True:
                      data = get_firebase_data(username)
                      if not data:
                          print("WARN: Firebase data empty, ending session")
                          break

                      streaming_active = data.get("streaming", False)
                      game_url = data.get("game_url", "")
                      stream_key = data.get("stream_key", "")
                      session_active = data.get("session_active", False)
                      start_time = data.get("start_time", 0)
                      end_time = data.get("end_time", 0)
                      broadcast_id = data.get("broadcast_id", "")

                      # ✅ الإصلاح الجذري لتوقيت الجلسة:
                      # end_time هو timestamp مطلق بالفعل (كتبه Apps Script كـ now + duration).
                      # لا نحسب الفرق ونعيد إضافته للوقت الحالي (كان يسبب تجديد لا نهائي).
                      calculated_end_time = end_time if end_time else 0

                      # ⏱️ حد أقصى احتياطي داخل السيرفر (لو end_time ضاع أو كان خاطئاً)
                      hard_deadline_ts = (session_loop_start_ts + SESSION_HARD_LIMIT_SECONDS) * 1000

                      print(f"STATE: session_active={session_active} streaming={streaming_active} stream_key={'YES' if stream_key else 'NO'} game_url={'YES' if game_url else 'NO'} end_in_sec={int((calculated_end_time - time.time()*1000)/1000) if calculated_end_time else 'N/A'}")

                      if not session_active: break

                      now_ms = time.time() * 1000

                      # ✅ إنهاء عند الوصول لـ end_time المطلق
                      if session_active and calculated_end_time and now_ms >= calculated_end_time:
                          print("⏰ Session time ended (absolute end_time). Stopping stream.")
                          patch_firebase(username, {"session_active": False, "streaming": False, "viewers_count": 0})
                          break

                      # ✅ إنهاء احتياطي عند تجاوز الحد الأقصى المسموح
                      if now_ms >= hard_deadline_ts:
                          print("⏰ Session hard limit reached. Stopping stream.")
                          patch_firebase(username, {"session_active": False, "streaming": False, "viewers_count": 0})
                          break

                      if (session_active and not streaming_active and not auto_start_done and start_time and stream_key):
                          elapsed = (time.time() * 1000) - start_time
                          if elapsed >= AUTO_START_DELAY_SECONDS * 1000:
                              patch_firebase(username, {"streaming": True})
                              streaming_active = True
                              auto_start_done = True

                      if game_url and game_url != last_url:
                          try:
                              # 🛡️ التحقق من أمان الرابط قبل فتحه
                              if not is_safe_url(game_url):
                                  print(f"❌ ERROR: Unsafe URL blocked: {game_url}")
                                  continue
                              
                              driver.get(game_url)
                              last_url = game_url
                              print(f"OK: Loaded game_url: {game_url}")
                              if not sleep_interruptible(2, username): break
                              os.system("xdotool key Tab Tab Tab Return")
                          except Exception as e:
                              print(f"WARN: Failed to load game_url: {e}")

                      if streaming_active and not ffmpeg_proc and stream_key:
                          print("=== Starting fan noise generator (ffplay) ===")
                          fan_cmd = ['ffplay', '-f', 'lavfi', '-i', 'anoisesrc=a=0.08:c=pink,lowpass=f=800', '-nodisp', '-loop', '0', '-loglevel', 'quiet']
                          fan_process = subprocess.Popen(fan_cmd, env=os.environ.copy())
                          GLOBAL_REFS["fan_process"] = fan_process

                          print("=== Starting FFmpeg stream ===")
                          ffmpeg_cmd = [
                              'ffmpeg', '-y', '-nostats', '-loglevel', 'info',
                              '-thread_queue_size', '1024',
                              '-f', 'x11grab', '-draw_mouse', '0', '-framerate', '60', '-video_size', '720x1360', '-i', f":{disp.display}",
                              '-itsoffset', '0.0', 
                              '-thread_queue_size', '1024',
                              '-f', 'pulse', '-i', f"{sink_name}.monitor",
                              '-map', '0:v', '-map', '1:a',
                              '-vf', 'crop=720:1200:0:120,scale=720:1280,fps=60',
                              '-vsync', '1', 
                              '-c:v', 'libx264', '-preset', 'ultrafast', '-tune', 'zerolatency',
                              '-x264-params', 'threads=2:sliced-threads=1',
                              '-max_muxing_queue_size', '1024',
                              '-b:v', '3000k', '-maxrate', '3000k', '-bufsize', '6000k',
                              '-r', '60', '-g', '120', '-keyint_min', '120', '-sc_threshold', '0',
                              '-pix_fmt', 'yuv420p',
                              '-c:a', 'aac', '-b:a', '128k',
                              '-f', 'flv',
                              f"rtmp://a.rtmp.youtube.com/live2/{stream_key}"
                          ]
                          # ✅ إعادة توجيه stderr و stdout إلى نفس تدفق الإخراج الظاهر في سجل Actions
                          ffmpeg_proc = subprocess.Popen(
                              ffmpeg_cmd,
                              stdout=subprocess.PIPE,
                              stderr=subprocess.STDOUT,
                              bufsize=1,
                              universal_newlines=True
                          )
                          GLOBAL_REFS["ffmpeg_proc"] = ffmpeg_proc
                          print(f"OK: FFmpeg PID = {ffmpeg_proc.pid}")

                      # ✅ طباعة سجل ffmpeg في الوقت الفعلي (للتشخيص)
                      if ffmpeg_proc and ffmpeg_proc.poll() is None:
                          try:
                              line = ffmpeg_proc.stdout.readline()
                              if line:
                                  print(f"[ffmpeg] {line.rstrip()}")
                          except Exception:
                              pass
                      elif ffmpeg_proc and ffmpeg_proc.poll() is not None:
                          print(f"ERROR: FFmpeg exited with code {ffmpeg_proc.returncode}")
                          ffmpeg_proc = None
                          GLOBAL_REFS["ffmpeg_proc"] = None

                      elif not streaming_active and ffmpeg_proc:
                          if fan_process:
                              fan_process.terminate()
                              fan_process = None
                          if ffmpeg_proc:
                              ffmpeg_proc.terminate()
                              ffmpeg_proc = None

                      # ============================================================
                      # 🔎 فحص عدد المشاهدين (بدون YouTube API)
                      # - يبدأ الفحص من اللحظة الأولى بعد أن يصبح البث نشطًا (كل 10 ثوانٍ)
                      # - يكتب العدد في Firebase فورًا لعرضه في لوحة التحكم
                      # - الإلغاء (إنهاء الجلسة) يحدث فقط بعد مرور VIEWER_KILL_AFTER_SECONDS (10 دقائق)
                      #   من start_time وفقط إذا كان العدد < 100
                      # ============================================================
                      if streaming_active and ffmpeg_proc and broadcast_id and start_time:
                          now_check_ts = time.time()
                          if (now_check_ts - last_viewer_check_ts) >= VIEWER_CHECK_INTERVAL_SECONDS:
                              viewer_check_count += 1
                              last_viewer_check_ts = now_check_ts
                              elapsed_since_start_sec = (now_check_ts * 1000 - start_time) / 1000.0
                              print(f"=== [Viewer Check #{viewer_check_count}] Querying viewers from page (elapsed {int(elapsed_since_start_sec)}s)... ===")
                              viewers = get_viewers_from_page(broadcast_id)
                              print(f"=== [Viewer Check] concurrent viewers = {viewers} ===")

                              # ✅ كتابة العدد في Firebase دائمًا (حتى في أول 10 دقائق) لعرضه في لوحة التحكم
                              if viewers is not None:
                                  patch_firebase(username, {
                                      "viewers_count": viewers,
                                      "viewers_updated_at": int(time.time() * 1000)
                                  })

                                  # ⛔ الإلغاء فقط بعد مرور 10 دقائق من start_time
                                  if elapsed_since_start_sec >= VIEWER_KILL_AFTER_SECONDS and viewers < VIEWER_MIN_THRESHOLD:
                                      print(f"❌ Viewers ({viewers}) < {VIEWER_MIN_THRESHOLD} after {int(elapsed_since_start_sec)}s. Ending session.")
                                      patch_firebase(username, {"session_active": False, "streaming": False, "viewers_count": 0})
                                      if ffmpeg_proc:
                                          try: ffmpeg_proc.kill()
                                          except: pass
                                          ffmpeg_proc = None
                                          GLOBAL_REFS["ffmpeg_proc"] = None
                                      if fan_process:
                                          try: fan_process.terminate()
                                          except: pass
                                          fan_process = None
                                          GLOBAL_REFS["fan_process"] = None
                                      break
                              else:
                                  print("⚠️ Could not read viewers this time, will retry next cycle.")

                      if not sleep_interruptible(3, username): break

              except Exception as e:
                  print(f"ERROR: Main loop exception: {e}")
              finally:
                  if fan_process:
                      try: fan_process.terminate()
                      except: pass
                  if ffmpeg_proc:
                      try: ffmpeg_proc.kill()
                      except: pass
                  try: driver.quit()
                  except: pass
                  disp.stop()
                  patch_firebase(username, {"session_active": False, "streaming": False, "viewers_count": 0})
                  print("=== Session ended ===")

          if __name__ == "__main__":
              main()
          EOF

      - name: Run Streaming Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ENABLE_STREAM: ${{ env.ENABLE_STREAM }}
          INPUT_USERNAME: ${{ github.event.inputs.username }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python main.py

      - name: Cleanup Firebase on Cancel/Timeout
        if: always()
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          INPUT_USERNAME: ${{ github.event.inputs.username }}
        run: |
          python -c "
          import os, json, requests, urllib.parse, google.auth.transport.requests
          from google.oauth2 import service_account
          try:
              username = os.environ['INPUT_USERNAME']
              sa_info = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT_JSON'])
              creds = service_account.Credentials.from_service_account_info(sa_info, scopes=['https://www.googleapis.com/auth/firebase.database'])
              creds.refresh(google.auth.transport.requests.Request())
              url = 'https://control-gitlive-default-rtdb.europe-west1.firebasedatabase.app/control/users/' + urllib.parse.quote(username) + '.json?access_token=' + urllib.parse.quote(creds.token)
              r = requests.patch(url, json={'session_active': False, 'streaming': False, 'viewers_count': 0}, headers={'Content-Type': 'application/json'}, timeout=10)
              print('Cleanup HTTP status:', r.status_code)
          except Exception as e:
              print('Cleanup failed:', e)
          "
