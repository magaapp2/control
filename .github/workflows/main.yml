name: Perpetual Dual Stream

on:
  workflow_dispatch:

concurrency:
  group: streaming-group
  cancel-in-progress: true

env:
  ENABLE_STREAM: 1

jobs:
  stream:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 🧹 Delete Old Logs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      - name: System Setup
        run: |
          echo "1. Updating Repositories..."
          sudo apt-get update -y
          
          echo "2. Installing Packages..."
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends xvfb ffmpeg pulseaudio unclutter xdotool curl
          
          echo "3. Setting up Audio..."
          pulseaudio -D --exit-idle-time=-1 --disallow-exit || true
          pactl load-module module-null-sink sink_name=Sink1

      - name: Python Setup
        run: pip install -U urllib3 chardet requests selenium pyvirtualdisplay

      - name: Create Python Script
        run: |
          cat << 'EOF' > main.py
          import os, subprocess, time, requests, signal, urllib.parse
          from pyvirtualdisplay import Display
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          # رابط قاعدة بيانات فايربيس الخاصة بك
          FIREBASE_URL = "https://control-gitlive-default-rtdb.europe-west1.firebasedatabase.app/control.json"

          # ⏱️ مدة الانتظار قبل بدء البث التلقائي (بالثواني)
          AUTO_START_DELAY_SECONDS = 90

          # مراجع عالمية للعمليات حتى يستطيع kill_all إنهاءها فوراً
          GLOBAL_REFS = {
              "ffmpeg_proc": None,
              "fan_process": None,
              "driver": None,
              "disp": None,
          }

          def get_firebase_data():
              try:
                  res = requests.get(FIREBASE_URL, timeout=5)
                  return res.json() or {}
              except Exception as e:
                  print(f"Error fetching Firebase: {e}")
                  return {}

          def cleanup_processes():
              """إنهاء FFmpeg و fan_process و driver و display بأمان."""
              fp = GLOBAL_REFS.get("fan_process")
              if fp:
                  try:
                      fp.terminate()
                  except:
                      pass
              ff = GLOBAL_REFS.get("ffmpeg_proc")
              if ff:
                  try:
                      ff.kill()
                  except:
                      pass
              drv = GLOBAL_REFS.get("driver")
              if drv:
                  try:
                      drv.quit()
                  except:
                      pass
              dsp = GLOBAL_REFS.get("disp")
              if dsp:
                  try:
                      dsp.stop()
                  except:
                      pass

          def kill_all(signum, frame):
              """يُستدعى عند SIGTERM/SIGINT — تنظيف سريع ثم خروج فوري."""
              print(f"⚠️ تم استلام إشارة ({signum}) — جاري التنظيف والخروج...")
              cleanup_processes()
              # محاولة إبلاغ Firebase بأن الجلسة توقفت (بمهلة قصيرة جداً)
              try:
                  requests.patch(FIREBASE_URL, json={"session_active": False, "streaming": False}, timeout=2)
              except:
                  pass
              print("🛑 خروج فوري.")
              os._exit(0)

          signal.signal(signal.SIGTERM, kill_all)
          signal.signal(signal.SIGINT, kill_all)

          def sleep_interruptible(seconds, data_check=True):
              """
              نوم قابل للمقاطعة: يفحص session_active كل ثانية.
              إذا أصبحت false → يخرج من النوم فوراً ويعيد False.
              يعيد True إذا اكتمل النوم بشكل طبيعي.
              """
              for _ in range(int(seconds)):
                  time.sleep(1)
                  if data_check:
                      d = get_firebase_data()
                      if not d.get("session_active", False):
                          return False
              return True

          def main():
              # تحديث حالة الجلسة في فايربيس لتصبح شغالة
              try:
                  requests.patch(FIREBASE_URL, json={"session_active": True})
              except:
                  pass

              sink_name = "Sink1"
              os.environ['PULSE_SINK'] = sink_name
              
              disp = Display(visible=0, size=(720, 1280), backend='xvfb')
              disp.start()
              GLOBAL_REFS["disp"] = disp
              os.environ['DISPLAY'] = f":{disp.display}"
              
              subprocess.Popen(['unclutter', '-idle', '0', '-display', f":{disp.display}"])
              
              opts = Options()
              opts.add_argument('--no-sandbox')
              opts.add_argument('--disable-dev-shm-usage')
              opts.add_argument('--autoplay-policy=no-user-gesture-required')
              opts.add_argument('--window-size=720,1280')
              opts.add_argument('--kiosk')
              
              driver = webdriver.Chrome(options=opts)
              driver.set_window_size(720, 1280)
              GLOBAL_REFS["driver"] = driver

              ffmpeg_proc = None
              fan_process = None
              last_url = ""
              script_triggered = False
              auto_start_done = False  # ⏱️ هل تم تنفيذ البدء التلقائي؟

              print("🟢 جيت هب بدأ الاستماع لأوامر لوحة التحكم لحظياً...")

              try:
                  while True:
                      # جلب البيانات من فايربيس
                      data = get_firebase_data()
                      streaming_active = data.get("streaming", False)
                      game_url = data.get("game_url", "")
                      stream_key = data.get("stream_key", "")
                      script_url = data.get("script_url", "")
                      session_active = data.get("session_active", False)
                      start_time = data.get("start_time", 0)
                      end_time = data.get("end_time", 0)  # ⏳ وقت الإنهاء العشوائي

                      # 🛑 إنهاء الجلسة إذا طلب المستخدم (session_active = false)
                      # هذا الفحص يضمن الاستجابة السريعة حتى لو لم يصل SIGTERM بعد
                      if not session_active:
                          print("🛑 تم إيقاف الجلسة من لوحة التحكم — خروج فوري...")
                          break

                      # ⏳ التحقق من انتهاء المدة العشوائية (1.5 - 2.3 ساعة) — إنهاء الجلسة
                      if session_active and end_time and (time.time() * 1000) >= end_time:
                          print("⏳ انتهت المدة العشوائية للجلسة — إيقاف البث وإنهاء الجلسة تلقائياً...")
                          try:
                              requests.patch(FIREBASE_URL, json={"session_active": False, "streaming": False})
                          except Exception as e:
                              print(f"⚠️ فشل إنهاء الجلسة في Firebase: {e}")
                          break

                      # ⏱️ البدء التلقائي للبث بعد 90 ثانية من start_time
                      # يعمل فقط إذا: الجلسة نشطة + لم يبدأ البث بعد + لم يُنفَّذ البدء التلقائي سابقاً
                      if (session_active and not streaming_active and not auto_start_done 
                              and start_time and stream_key):
                          elapsed = (time.time() * 1000) - start_time
                          if elapsed >= AUTO_START_DELAY_SECONDS * 1000:
                              print(f"⏱️ مرت {int(elapsed/1000)} ثانية منذ بدء الجلسة — تشغيل البث تلقائياً...")
                              try:
                                  requests.patch(FIREBASE_URL, json={"streaming": True})
                                  streaming_active = True
                                  print("✅ تم كتابة streaming=True في Firebase تلقائياً.")
                              except Exception as e:
                                  print(f"⚠️ فشل كتابة streaming في Firebase: {e}")
                              auto_start_done = True

                      # 1. رابط النشر (Google Apps Script) — يُستدعى من HTML فقط
                      # لا نستدعيه من هنا لتجنب إنشاء بث مزدوج وحذف البث الأصلي
                      if script_url and not script_triggered:
                          print("ℹ️ تم تخطي استدعاء Apps Script (يُستدعى من HTML فقط).")
                          script_triggered = True  # نعتبره مُنفَّذاً حتى لا تتكرر المحاولة

                      # 2. تحديث رابط اللعبة لحظياً إذا غيره المستخدم في الصفحة
                      if game_url and game_url != last_url and script_triggered:
                          print(f"🔄 جاري الانتقال لرابط اللعبة الجديد: {game_url}")
                          try:
                              driver.get(game_url)
                              last_url = game_url
                              # نوم قابل للمقاطعة بدل time.sleep(5)
                              if not sleep_interruptible(5):
                                  print("🛑 تم إيقاف الجلسة أثناء انتظار تحميل اللعبة.")
                                  break
                              os.system("xdotool key Tab Tab Tab Return")
                          except Exception as e:
                              print(f"Error loading game URL: {e}")

                      # 3. تشغيل أو إيقاف بث FFmpeg بناءً على زر لوحة التحكم وشفرة البث
                      if streaming_active and not ffmpeg_proc and stream_key:
                          print("🚀 بدء بث FFmpeg إلى يوتيوب مع إعدادات السلاسة وإخفاء الجزء العلوي...")
                          
                          # صوت خلفية خفيف لمنع صمت البث
                          fan_cmd = [
                              'ffplay', '-f', 'lavfi', 
                              '-i', 'anoisesrc=a=0.08:c=pink,lowpass=f=800', 
                              '-nodisp', '-loop', '0', '-loglevel', 'quiet'
                          ]
                          fan_env = os.environ.copy()
                          fan_env['PULSE_SINK'] = sink_name
                          fan_process = subprocess.Popen(fan_cmd, env=fan_env)
                          GLOBAL_REFS["fan_process"] = fan_process

                          # أمر البث المحسن مع الـ Buffer وإخفاء 10% من أعلى الشاشة (يساوي 128 بكسل) لتغطيتها بأسود أو اقتصاصها
                          ffmpeg_cmd = [
                              'ffmpeg', '-y',
                              '-nostats', '-loglevel', 'error',
                              '-thread_queue_size', '1024',
                              '-f', 'x11grab',
                              '-draw_mouse', '0',
                              '-framerate', '60',
                              '-video_size', '720x1280',
                              '-i', f":{disp.display}",
                              '-thread_queue_size', '1024',
                              '-f', 'pulse',
                              '-i', f"{sink_name}.monitor",
                              '-map', '0:v',
                              '-map', '1:a',
                              
                              # فلتر السلاسة وتغطية أول 10% من أعلى الشاشة (128 بكسل) بلون أسود لمنع ظهور أي شريط غير مرغوب فيه
                              '-vf', 'fps=60,drawbox=x=0:y=0:w=720:h=192:color=black:t=fill',
                              
                              '-c:v', 'libx264',
                              '-preset', 'ultrafast',
                              '-tune', 'zerolatency',
                              '-x264-params', 'threads=2:sliced-threads=1',
                              '-max_muxing_queue_size', '1024',
                              '-b:v', '3000k',
                              '-maxrate', '3000k',
                              '-bufsize', '6000k',
                              '-r', '60',
                              '-g', '120',
                              '-keyint_min', '120',
                              '-sc_threshold', '0',
                              '-pix_fmt', 'yuv420p',
                              '-c:a', 'aac',
                              '-b:a', '128k',
                              '-f', 'flv',
                              f"rtmp://a.rtmp.youtube.com/live2/{stream_key}"
                          ]
                          ffmpeg_proc = subprocess.Popen(ffmpeg_cmd)
                          GLOBAL_REFS["ffmpeg_proc"] = ffmpeg_proc

                      elif not streaming_active and ffmpeg_proc:
                          print("⏹️ تم إيقاف البث من لوحة التحكم.")
                          if fan_process:
                              fan_process.terminate()
                              fan_process = None
                              GLOBAL_REFS["fan_process"] = None
                          if ffmpeg_proc:
                              ffmpeg_proc.terminate()
                              ffmpeg_proc = None
                              GLOBAL_REFS["ffmpeg_proc"] = None

                      # الانتظار 3 ثوانٍ قبل فحص الأوامر الجديدة من فايربيس
                      # نستخدم نوم قابل للمقاطعة بدل time.sleep(3)
                      if not sleep_interruptible(3):
                          print("🛑 تم إيقاف الجلسة أثناء الانتظار.")
                          break

              except Exception as e:
                  print(f"Error in main loop: {e}")
              finally:
                  print("🧹 بدء التنظيف النهائي...")
                  if fan_process: 
                      try: fan_process.terminate()
                      except: pass
                  if ffmpeg_proc: 
                      try: ffmpeg_proc.kill()
                      except: pass
                  try:
                      driver.quit()
                  except:
                      pass
                  disp.stop()
                  
                  # تحديث الحالة في فايربيس بأن الجلسة توقفت
                  try:
                      requests.patch(FIREBASE_URL, json={"session_active": False, "streaming": False}, timeout=3)
                  except:
                      pass
                  print("🛑 انتهت جلسة البث تماماً.")

          if __name__ == "__main__":
              main()
          EOF

      - name: Run Streaming Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ENABLE_STREAM: ${{ env.ENABLE_STREAM }}
        run: python main.py
