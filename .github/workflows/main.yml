name: Stream Session

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'اسم المستخدم صاحب الجلسة'
        required: true
        type: string

concurrency:
  group: streaming-group-${{ github.event.inputs.username }}
  cancel-in-progress: true

env:
  ENABLE_STREAM: 1

jobs:
  stream:
    name: "👤 ${{ github.event.inputs.username }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 🧹 Delete Old Logs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      # 🚀 السرعة الخارقة: أداة تثبيت وحفظ ملفات النظام (System Packages)
      - name: Install System Dependencies (Fast Cache)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: xvfb ffmpeg pulseaudio unclutter xdotool curl dbus dbus-x11
          version: 1.0

      - name: Setup Chrome & Notifications
        run: |
          # التحقق من وجود كروم، لو مش موجود بيحمله (مش هيحصل في العادة لأن جيت هب فيه كروم)
          if ! command -v google-chrome-stable &> /dev/null; then
            echo "Chrome not found. Installing..."
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -y -f || true
            rm google-chrome-stable_current_amd64.deb
          else
            echo "Chrome is already installed. Skipping to save time."
          fi

          # إعداد الصوت
          pulseaudio -D --exit-idle-time=-1 --disallow-exit || true
          pactl load-module module-null-sink sink_name=Sink1

          # إخفاء الإشعارات
          mkdir -p ~/.config
          export $(dbus-launch) || true
          sudo tee /usr/local/bin/notify-send > /dev/null <<'NS'
          #!/bin/sh
          exit 0
          NS
          sudo chmod +x /usr/local/bin/notify-send

      # 🚨 حل مشكلة التعارض: حذف الكروم درايفر القديم من مسار جيت هب
      - name: Remove old Chromedriver & Python Setup
        run: |
          sudo rm -f /usr/bin/chromedriver
          sudo rm -f /usr/local/bin/chromedriver
          pip install -U urllib3 chardet requests selenium pyvirtualdisplay

      - name: Create Python Script
        run: |
          cat << 'EOF' > main.py
          import os, subprocess, time, requests, signal, urllib.parse, tempfile, json
          from pyvirtualdisplay import Display
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          FIREBASE_BASE = "https://control-gitlive-default-rtdb.europe-west1.firebasedatabase.app"
          
          # ⏱️ تم تعديلها لتبدأ بعد 5 ثوانٍ فقط
          AUTO_START_DELAY_SECONDS = 5 

          GLOBAL_REFS = {
              "ffmpeg_proc": None,
              "fan_process": None,
              "driver": None,
              "disp": None,
              "username": None
          }

          def user_url(username):
              return FIREBASE_BASE + "/control/users/" + username + ".json"

          def get_firebase_data(username):
              if not username: return {}
              try:
                  res = requests.get(user_url(username), timeout=5)
                  return res.json() or {}
              except Exception:
                  return {}

          def cleanup_processes():
              for key in ["fan_process", "ffmpeg_proc"]:
                  p = GLOBAL_REFS.get(key)
                  if p:
                      try: p.terminate()
                      except: pass
              drv = GLOBAL_REFS.get("driver")
              if drv:
                  try: drv.quit()
                  except: pass
              dsp = GLOBAL_REFS.get("disp")
              if dsp:
                  try: dsp.stop()
                  except: pass

          def kill_all(signum, frame):
              cleanup_processes()
              u = GLOBAL_REFS.get("username")
              if u:
                  try:
                      requests.patch(user_url(u), json={"session_active": False, "streaming": False}, timeout=2)
                  except: pass
              os._exit(0)

          signal.signal(signal.SIGTERM, kill_all)
          signal.signal(signal.SIGINT, kill_all)

          def sleep_interruptible(seconds, username):
              for _ in range(int(seconds)):
                  time.sleep(1)
                  d = get_firebase_data(username)
                  if not d.get("session_active", False):
                      return False
              return True

          def build_chrome_prefs_dir():
              profile_dir = tempfile.mkdtemp(prefix="chrome-profile-")
              default_dir = os.path.join(profile_dir, "Default")
              os.makedirs(default_dir, exist_ok=True)
              prefs = {
                  "profile": {
                      "default_content_setting_values": {
                          "notifications": 2, "geolocation": 2,
                          "media_stream": 1, "media_stream_mic": 1, "media_stream_camera": 1, "sound": 1,
                      },
                      "default_content_settings": {"notifications": 2, "popups": 1, "geolocation": 2},
                      "block_popups": False, "exit_type": "Normal", "exited_cleanly": True,
                  },
                  "bookmark_bar": { "show_on_all_tabs": False },
                  "translate": { "enabled": False },
                  "credentials_enable_service": False,
                  "profile.password_manager_enabled": False,
                  "browser": { "has_seen_welcome_page": True, "check_default_browser": False },
                  "distribution": {
                      "skip_first_run_ui": True, "suppress_first_run_bubble": True,
                      "import_bookmarks": False, "import_history": False,
                      "show_welcome_page": False, "skip_first_run_tasks": True,
                  },
              }
              with open(os.path.join(default_dir, "Preferences"), "w", encoding="utf-8") as f:
                  json.dump(prefs, f)
              return profile_dir

          def main():
              username = os.environ.get("INPUT_USERNAME")
              if not username: return
              GLOBAL_REFS["username"] = username
              try:
                  requests.patch(user_url(username), json={"session_active": True})
              except: pass

              sink_name = "Sink1"
              os.environ['PULSE_SINK'] = sink_name
              os.environ['DBUS_SESSION_BUS_ADDRESS'] = '/dev/null'
              os.environ['NOTIFY_SOCKET'] = '/dev/null'

              disp = Display(visible=0, size=(720, 1360), backend='xvfb')
              disp.start()
              GLOBAL_REFS["disp"] = disp
              os.environ['DISPLAY'] = f":{disp.display}"

              subprocess.Popen(['unclutter', '-idle', '0', '-display', f":{disp.display}"])

              opts = Options()
              opts.add_argument('--no-sandbox')
              opts.add_argument('--disable-dev-shm-usage')
              opts.add_argument('--autoplay-policy=no-user-gesture-required')
              opts.add_argument('--window-size=720,1360')
              opts.add_argument('--start-maximized')
              opts.add_argument('--disable-infobars')
              opts.add_argument('--disable-notifications')
              opts.add_argument('--disable-push-api')
              opts.add_argument('--disable-desktop-notifications')
              opts.add_argument('--disable-features=TranslateUI,Translate,NotificationTriggers,NotificationIndicator,WebPush,BackgroundFetch,PeriodicBackgroundSync,GlobalMediaControls,MediaRouter')
              opts.add_argument('--no-default-browser-check')
              opts.add_argument('--no-first-run')
              opts.add_argument('--disable-sync')

              prefs = {
                  "credentials_enable_service": False,
                  "profile.password_manager_enabled": False,
                  "profile.default_content_setting_values.notifications": 2,
                  "bookmark_bar": { "show_on_all_tabs": False }
              }
              opts.add_experimental_option("prefs", prefs)
              opts.add_experimental_option("excludeSwitches", ["enable-automation", "enable-logging"])
              opts.add_experimental_option("useAutomationExtension", False)

              opts.add_argument(f"--user-data-dir={build_chrome_prefs_dir()}")

              driver = webdriver.Chrome(options=opts)
              driver.set_window_size(720, 1360)

              try:
                  driver.execute_cdp_cmd("Browser.setPermission", {"permission": {"name": "notifications"}, "setting": "denied", "origin": "*"})
                  driver.execute_cdp_cmd("Page.enable", {})
              except Exception:
                  pass

              GLOBAL_REFS["driver"] = driver
              ffmpeg_proc = None
              fan_process = None
              last_url = ""
              auto_start_done = False

              try:
                  while True:
                      data = get_firebase_data(username)
                      if not data: break

                      streaming_active = data.get("streaming", False)
                      game_url = data.get("game_url", "")
                      stream_key = data.get("stream_key", "")
                      session_active = data.get("session_active", False)
                      start_time = data.get("start_time", 0)
                      end_time = data.get("end_time", 0)

                      if not session_active: break

                      if session_active and end_time and (time.time() * 1000) >= end_time:
                          try: requests.patch(user_url(username), json={"session_active": False, "streaming": False})
                          except: pass
                          break

                      if (session_active and not streaming_active and not auto_start_done and start_time and stream_key):
                          elapsed = (time.time() * 1000) - start_time
                          if elapsed >= AUTO_START_DELAY_SECONDS * 1000:
                              try:
                                  requests.patch(user_url(username), json={"streaming": True})
                                  streaming_active = True
                              except: pass
                              auto_start_done = True

                      if game_url and game_url != last_url:
                          try:
                              driver.get(game_url)
                              last_url = game_url
                              if not sleep_interruptible(2, username): break
                              os.system("xdotool key Tab Tab Tab Return")
                          except Exception:
                              pass

                      if streaming_active and not ffmpeg_proc and stream_key:
                          fan_cmd = ['ffplay', '-f', 'lavfi', '-i', 'anoisesrc=a=0.08:c=pink,lowpass=f=800', '-nodisp', '-loop', '0', '-loglevel', 'quiet']
                          fan_process = subprocess.Popen(fan_cmd, env=os.environ.copy())
                          GLOBAL_REFS["fan_process"] = fan_process

                          ffmpeg_cmd = [
                              'ffmpeg', '-y', '-nostats', '-loglevel', 'error',
                              '-thread_queue_size', '1024',
                              '-f', 'x11grab', '-draw_mouse', '0', '-framerate', '60', '-video_size', '720x1360', '-i', f":{disp.display}",
                              '-itsoffset', '0.2', 
                              '-thread_queue_size', '1024',
                              '-f', 'pulse', '-i', f"{sink_name}.monitor",
                              '-map', '0:v', '-map', '1:a',
                              '-vf', 'crop=720:1210:0:150,fps=60',
                              '-vsync', '1', 
                              '-c:v', 'libx264', '-preset', 'ultrafast', '-tune', 'zerolatency',
                              '-x264-params', 'threads=2:sliced-threads=1',
                              '-max_muxing_queue_size', '1024',
                              '-b:v', '3000k', '-maxrate', '3000k', '-bufsize', '6000k',
                              '-r', '60', '-g', '120', '-keyint_min', '120', '-sc_threshold', '0',
                              '-pix_fmt', 'yuv420p',
                              '-c:a', 'aac', '-b:a', '128k',
                              '-f', 'flv',
                              f"rtmp://a.rtmp.youtube.com/live2/{stream_key}"
                          ]
                          ffmpeg_proc = subprocess.Popen(ffmpeg_cmd)
                          GLOBAL_REFS["ffmpeg_proc"] = ffmpeg_proc

                      elif not streaming_active and ffmpeg_proc:
                          if fan_process:
                              fan_process.terminate()
                              fan_process = None
                          if ffmpeg_proc:
                              ffmpeg_proc.terminate()
                              ffmpeg_proc = None

                      if not sleep_interruptible(3, username): break

              except Exception:
                  pass
              finally:
                  if fan_process:
                      try: fan_process.terminate()
                      except: pass
                  if ffmpeg_proc:
                      try: ffmpeg_proc.kill()
                      except: pass
                  try: driver.quit()
                  except: pass
                  disp.stop()
                  try: requests.patch(user_url(username), json={"session_active": False, "streaming": False}, timeout=3)
                  except: pass

          if __name__ == "__main__":
              main()
          EOF

      - name: Run Streaming Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ENABLE_STREAM: ${{ env.ENABLE_STREAM }}
          INPUT_USERNAME: ${{ github.event.inputs.username }}
        run: python main.py

      - name: Cleanup Firebase on Cancel/Timeout
        if: always()
        run: |
          curl -X PATCH \
          -H "Content-Type: application/json" \
          -d '{"session_active": false, "streaming": false}' \
          "https://control-gitlive-default-rtdb.europe-west1.firebasedatabase.app/control/users/${{ github.event.inputs.username }}.json"
